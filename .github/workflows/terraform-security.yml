name: terraform-security
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Checkov
        run: pip install checkov
      - name: Scan modern Terraform modules
        run: checkov -d modules --framework terraform --quiet
      - name: Scan environment composition
        run: checkov -d environments --framework terraform --quiet
